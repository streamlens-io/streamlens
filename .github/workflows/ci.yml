name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev nasm cmake pkg-config ffmpeg

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm cmake pkg-config ffmpeg

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache vendored decoders
        uses: actions/cache@v5
        with:
          path: |
            vendor/ffmpeg-prefix
            vendor/libde265-prefix
            vendor/.stamp
          key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/patches/**', 'vendor/build-decoders.sh') }}

      - uses: Swatinem/rust-cache@v2

      - name: Build patched decoders
        run: ./vendor/build-decoders.sh

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Decoder smoke tests (C)
        run: ./vendor/smoke/run.sh

  test-windows:
    name: test (windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      # MSYS2's Rust targets x86_64-pc-windows-gnu and shares the MinGW
      # toolchain that builds the decoders. ffmpeg is the pixel reference
      # in the tests.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            git make diffutils
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-ffmpeg

      - name: Cache vendored decoders
        uses: actions/cache@v5
        with:
          path: |
            vendor/ffmpeg-prefix
            vendor/libde265-prefix
            vendor/.stamp
          key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/patches/**', 'vendor/build-decoders.sh') }}

      - name: Build patched decoders
        run: ./vendor/build-decoders.sh

      - name: Tests
        env:
          LIBCLANG_PATH: /mingw64/bin
        run: cargo test --workspace
