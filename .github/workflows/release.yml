name: Release

# Tags publish a GitHub release; a manual run only builds the packages and
# keeps them as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The release profile keeps debug info for local profiling; packages
  # ship without it.
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  CARGO_PROFILE_RELEASE_STRIP: "debuginfo"

jobs:
  macos:
    name: macos (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    env:
      # Applies to the C decoders (clang, cmake) and to rustc alike.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install nasm cmake

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache vendored decoders
        uses: actions/cache@v4
        with:
          path: |
            vendor/ffmpeg-prefix
            vendor/libde265-prefix
            vendor/.stamp
          key: vendor-${{ matrix.target }}-${{ hashFiles('vendor/patches/**', 'vendor/build-decoders.sh') }}

      - uses: Swatinem/rust-cache@v2

      - name: Build patched decoders
        run: ./vendor/build-decoders.sh

      - name: Build
        run: cargo build --release -p streamlens

      - name: Check the binary needs only system libraries
        run: |
          otool -L target/release/streamlens
          if otool -L target/release/streamlens | tail -n +2 \
              | grep -vE '^\s+(/usr/lib/|/System/Library/)'; then
            echo "non-system dynamic library linked" >&2
            exit 1
          fi

      - name: Package
        run: |
          ./packaging/macos-app.sh
          name="streamlens-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}"
          ./packaging/macos-dmg.sh target/StreamLens.app "$name.dmg"
          shasum -a 256 "$name.dmg" > "$name.dmg.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: streamlens-${{ matrix.target }}
          path: streamlens-*.dmg*

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: streamlens-*.dmg*

  linux:
    name: linux (${{ matrix.target }})
    # The oldest supported runner: the binary needs this glibc or newer.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev nasm cmake

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache vendored decoders
        uses: actions/cache@v4
        with:
          path: |
            vendor/ffmpeg-prefix
            vendor/libde265-prefix
            vendor/.stamp
          key: vendor-${{ matrix.target }}-${{ hashFiles('vendor/patches/**', 'vendor/build-decoders.sh') }}

      - uses: Swatinem/rust-cache@v2

      - name: Build patched decoders
        run: ./vendor/build-decoders.sh

      - name: Build
        run: cargo build --release -p streamlens

      - name: Check the binary needs only base system libraries
        run: |
          ldd target/release/streamlens
          if ldd target/release/streamlens \
              | grep -vE '^\s+(linux-vdso|linux-gate|/lib.*/ld-linux|lib(c|m|dl|rt|pthread|gcc_s|stdc\+\+|z)\.so)'; then
            echo "unexpected dynamic library linked" >&2
            exit 1
          fi

      - name: Package
        run: |
          name="streamlens-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}"
          mkdir "$name"
          cp target/release/streamlens README.md \
            LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md "$name/"
          cp -R licenses "$name/licenses"
          tar czf "$name.tar.gz" "$name"

          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x appimagetool
          ./packaging/linux-appimage.sh target/release/streamlens ./appimagetool "$name.AppImage"

          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          sha256sum "$name.AppImage" > "$name.AppImage.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: streamlens-${{ matrix.target }}
          path: |
            streamlens-*.tar.gz*
            streamlens-*.AppImage*

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            streamlens-*.tar.gz*
            streamlens-*.AppImage*

  windows:
    name: windows (x86_64-pc-windows-gnu)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            git make diffutils zip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-rust

      - name: Cache vendored decoders
        uses: actions/cache@v4
        with:
          path: |
            vendor/ffmpeg-prefix
            vendor/libde265-prefix
            vendor/.stamp
          key: vendor-windows-${{ hashFiles('vendor/patches/**', 'vendor/build-decoders.sh') }}

      - name: Build patched decoders
        run: ./vendor/build-decoders.sh

      - name: Build
        env:
          LIBCLANG_PATH: /mingw64/bin
        run: cargo build --release -p streamlens

      - name: Package
        run: |
          name="streamlens-${GITHUB_REF_NAME//\//-}-x86_64-pc-windows-gnu"
          mkdir "$name"
          cp target/release/streamlens.exe README.md \
            LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md "$name/"
          cp -R licenses "$name/licenses"
          # The MinGW runtime DLLs (libstdc++, libgcc, winpthread) ship
          # next to the exe; everything else is part of Windows.
          ldd target/release/streamlens.exe
          ldd target/release/streamlens.exe | awk '$3 ~ /^\/mingw64\// { print $3 }' \
            | xargs -r -I{} cp {} "$name/"
          ls "$name"
          zip -r "$name.zip" "$name"
          sha256sum "$name.zip" > "$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: streamlens-x86_64-pc-windows-gnu
          path: streamlens-*.zip*

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: streamlens-*.zip*
