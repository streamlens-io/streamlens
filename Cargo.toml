[workspace]
resolver = "2"
members = [
    "crates/types",
    "crates/syntax",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/axeltob/streamlens"

[workspace.dependencies]
streamlens-types = { path = "crates/types" }
streamlens-syntax = { path = "crates/syntax" }
streamlens-gst = { path = "crates/gst" }
streamlens-core = { path = "crates/core" }

gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
gstreamer-base = "0.25"
gstreamer-pbutils = "0.25"

thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"

[profile.release]
# Keep symbols for profiling.
debug = true

[profile.dev]
# Decoders and pixel loops are unusable at opt-level 0.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
