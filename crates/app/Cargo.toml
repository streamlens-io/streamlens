[package]
name = "streamlens"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "streamlens"
path = "src/main.rs"

[dependencies]
streamlens-types = { workspace = true }
streamlens-core = { workspace = true }
iced = { version = "0.14", features = ["wgpu", "image", "canvas", "tokio", "advanced", "lazy"] }
rfd = "0.15"
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[build-dependencies]
winresource = "0.1"
